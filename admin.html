<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ElectroHub Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        html{font-size:14px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
        *{margin:0;padding:0;box-sizing:border-box;max-width:100%}
        :root{--p:#FF7A00;--pd:#E56D00;--pl:#FFF3E6;--w:#FFF;--lg:#F8F8F8;--g:#E5E5E5;--mg:#999;--d:#222;--dl:#555;--s:#28a745;--dn:#dc3545;--wn:#ffc107;--i:#17a2b8;--sb:240px;--sh:0 2px 8px rgba(0,0,0,0.05);--tr:all 0.3s ease}
        body{font-family:'Segoe UI',sans-serif;background:var(--lg);color:var(--d);overflow-x:hidden;width:100%}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

        /* LOGIN */
        .ls{position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;z-index:9999;transition:all 0.5s}
        .ls.h{opacity:0;visibility:hidden;pointer-events:none}
        .lb{background:var(--w);border-radius:16px;padding:35px 28px;width:100%;max-width:360px;margin:15px;box-shadow:0 20px 50px rgba(0,0,0,0.4);text-align:center;animation:slideUp 0.5s}
        .licon{width:60px;height:60px;background:linear-gradient(135deg,var(--p),#FF9A3C);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 15px}
        .licon i{font-size:26px;color:white}
        .lb h2{font-size:18px;margin-bottom:4px}
        .lb>p{color:var(--mg);font-size:12px;margin-bottom:20px}
        .linp{position:relative;margin-bottom:10px}
        .linp input{width:100%;padding:11px 40px 11px 14px;border:2px solid var(--g);border-radius:10px;font-size:14px;outline:none;letter-spacing:3px;text-align:center;font-family:monospace;transition:var(--tr)}
        .linp input:focus{border-color:var(--p)}
        .linp input.err{border-color:var(--dn);animation:shake 0.4s}
        .linp input.ok{border-color:var(--s)}
        .eyeb{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;color:#aaa}
        .lerr{color:var(--dn);font-size:11px;min-height:14px;margin-bottom:6px;opacity:0;transition:opacity 0.3s;display:flex;align-items:center;justify-content:center;gap:3px}
        .lerr.sh{opacity:1}
        .lbtn{width:100%;padding:12px;background:linear-gradient(135deg,var(--p),#FF9A3C);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:6px}
        .lbtn:hover{transform:translateY(-2px)}
        .lbtn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
        .lbtn.ok{background:linear-gradient(135deg,var(--s),#20c997)}
        .lfooter{margin-top:14px;font-size:10px;color:#aaa}
        a.backl{display:inline-flex;align-items:center;gap:4px;color:var(--p);font-size:12px;margin-top:10px;text-decoration:none}

        /* LAYOUT */
        .adm{display:none;min-height:100vh}
        .adm.sh{display:flex;animation:fadeIn 0.4s}

        /* SIDEBAR */
        .sd{width:var(--sb);background:linear-gradient(180deg,#1a1a2e,#16213e);color:white;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;transition:transform 0.3s}
        .sdh{padding:16px 14px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:10px}
        .sdh .lgic{width:34px;height:34px;background:var(--p);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:white}
        .sdh h2{font-size:15px}
        .sdh h2 span{color:var(--p)}
        .sdh small{display:block;font-size:9px;color:#666}
        .sdnav{padding:8px 0}
        .sdnav a{display:flex;align-items:center;gap:9px;padding:10px 18px;color:#888;font-size:12px;transition:var(--tr);border-left:3px solid transparent;cursor:pointer;text-decoration:none}
        .sdnav a:hover{color:white;background:rgba(255,255,255,0.05)}
        .sdnav a.act{color:white;background:rgba(255,122,0,0.15);border-left-color:var(--p)}
        .sdnav a i{width:16px;text-align:center;font-size:12px}
        .nbg{margin-left:auto;background:var(--p);color:white;font-size:9px;padding:2px 6px;border-radius:8px;font-weight:600}
        .nbg.red{background:var(--dn);animation:pulse 1.5s infinite}
        .ndiv{height:1px;background:rgba(255,255,255,0.08);margin:6px 16px}
        .sdft{padding:14px 16px;border-top:1px solid rgba(255,255,255,0.08);position:absolute;bottom:0;width:100%}
        .sdft a{display:flex;align-items:center;gap:6px;color:#dc3545;font-size:12px;cursor:pointer;text-decoration:none}

        /* MAIN */
        .main{margin-left:var(--sb);flex:1;min-height:100vh}

        /* TOPBAR */
        .topbar2{background:var(--w);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh);position:sticky;top:0;z-index:50}
        .topbar2 h3{font-size:15px;display:flex;align-items:center;gap:7px}
        .topbar2 h3 i{color:var(--p);font-size:14px}
        .tright{display:flex;align-items:center;gap:8px}
        .stlink{padding:6px 12px;background:var(--pl);color:var(--p);border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;text-decoration:none;transition:var(--tr)}
        .stlink:hover{background:var(--p);color:white}
        .rfbtn{padding:6px 10px;background:var(--lg);border:1px solid var(--g);border-radius:6px;cursor:pointer;font-size:12px;transition:var(--tr)}
        .rfbtn:hover{background:var(--p);color:white;border-color:var(--p)}
        .rfbtn.spinning i{animation:spin 1s linear infinite}
        .mtoggle{display:none;background:none;border:none;font-size:18px;cursor:pointer}
        .content{padding:16px 20px}

        /* TABS */
        .atab{display:none;animation:fadeIn 0.4s}
        .atab.act{display:block}

        /* STATS */
        .sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
        .scard{background:var(--w);padding:16px;border-radius:10px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);transition:transform 0.3s;border-left:3px solid transparent}
        .scard:hover{transform:translateY(-2px)}
        .scard:nth-child(1){border-left-color:#667eea}
        .scard:nth-child(2){border-left-color:#28a745}
        .scard:nth-child(3){border-left-color:var(--p)}
        .scard:nth-child(4){border-left-color:#dc3545}
        .sicon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;color:white}
        .sicon.bl{background:linear-gradient(135deg,#667eea,#764ba2)}
        .sicon.gr{background:linear-gradient(135deg,#11998e,#38ef7d)}
        .sicon.or{background:linear-gradient(135deg,#f12711,#f5af19)}
        .sicon.rd{background:linear-gradient(135deg,#eb3349,#f45c43)}
        .sinfo h4{font-size:20px;font-weight:700;margin-bottom:1px}
        .sinfo p{font-size:10px;color:var(--mg)}

        .dgrid{display:grid;grid-template-columns:2fr 1fr;gap:14px}
        .card2{background:var(--w);border-radius:10px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
        .card2 h4{font-size:13px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--pl);display:flex;align-items:center;gap:5px}
        .card2 h4 i{color:var(--p);font-size:12px}

        /* FILTERS */
        .filtbtns{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
        .filtb{padding:6px 12px;border:1px solid var(--g);background:var(--w);border-radius:16px;cursor:pointer;font-size:11px;transition:var(--tr);font-weight:500}
        .filtb.act,.filtb:hover{background:var(--p);color:white;border-color:var(--p)}

        /* ORDER ROW */
        .orow{background:var(--w);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--g);transition:var(--tr)}
        .orow:hover{box-shadow:0 3px 10px rgba(0,0,0,0.05)}
        .orow.neworder{border-left:3px solid var(--p);animation:fadeIn 0.5s}
        .orowh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:5px}
        .orowh h5{color:var(--p);font-size:12px;display:flex;align-items:center;gap:4px}
        .orowb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;color:var(--dl);margin-bottom:8px}
        .orowb strong{display:block;margin-top:1px;color:var(--d);font-size:11px}
        .oitems{background:var(--lg);padding:8px;border-radius:6px;margin-bottom:8px;font-size:10px}
        .oitems h6{font-size:10px;margin-bottom:4px}
        .oiline{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--g);font-size:10px}
        .oiline:last-child{border:none}
        .orowf{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--g);flex-wrap:wrap;gap:6px}
        .ototal{font-size:14px;font-weight:700;color:var(--p)}

        .sbadge{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;display:inline-block}
        .s-Pending{background:#FFF3CD;color:#856404}
        .s-Confirmed{background:#D1ECF1;color:#0C5460}
        .s-Shipped{background:#CCE5FF;color:#004085}
        .s-Delivered{background:#D4EDDA;color:#155724}
        .s-Cancelled{background:#F8D7DA;color:#721C24}
        .ssel{padding:5px 10px;border:1px solid var(--g);border-radius:6px;font-size:11px;outline:none;cursor:pointer}

        /* PRODUCT ROW */
        .prow{background:var(--w);padding:8px 10px;border-radius:8px;display:flex;align-items:center;gap:8px;margin-bottom:6px;border:1px solid var(--g);transition:var(--tr);font-size:11px}
        .prow:hover{box-shadow:0 2px 6px rgba(0,0,0,0.04)}
        .pimg{width:34px;height:34px;background:var(--lg);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
        .pimg img{max-width:100%;max-height:100%;object-fit:contain}
        .pimg i{color:var(--g);font-size:13px}
        .pinfo{flex:1;min-width:0}
        .pinfo h5{font-size:11px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pinfo span{font-size:9px;color:var(--mg);display:flex;align-items:center;gap:2px;flex-wrap:wrap}
        .ptag{font-size:8px;padding:1px 3px;border-radius:2px;font-weight:600}
        .ptag.new{background:#D4EDDA;color:#155724}
        .ptag.hot{background:var(--pl);color:var(--p)}
        .ptag.sale{background:#F8D7DA;color:#721C24}
        .ptag.flash{background:#CCE5FF;color:#004085}
        .pprice{font-weight:700;color:var(--p);min-width:65px;font-size:11px;text-align:right}
        .pprice s{color:var(--mg);font-weight:400;font-size:9px;margin-left:2px}
        .pstock{min-width:50px;font-size:10px;text-align:center}
        .pstock.low{color:var(--dn);font-weight:600}
        .pacts{display:flex;gap:3px}
        .pacts button{width:26px;height:26px;border:none;border-radius:5px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
        .bedit{background:#D1ECF1;color:#0C5460}
        .bedit:hover{background:var(--i);color:white}
        .bdel{background:#F8D7DA;color:#721C24}
        .bdel:hover{background:var(--dn);color:white}

        /* ADD BUTTON */
        .badd{padding:7px 14px;background:var(--p);color:white;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:4px;transition:var(--tr)}
        .badd:hover{background:var(--pd)}

        /* FORM */
        .pform{background:var(--w);padding:16px;border-radius:10px;margin-bottom:14px;display:none;animation:fadeIn 0.3s;border:2px solid var(--pl)}
        .pform.show{display:block}
        .pform h4{font-size:14px;color:var(--p);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--pl);display:flex;align-items:center;gap:5px}
        .frow{display:flex;gap:10px}
        .fgrp{flex:1;margin-bottom:10px}
        .fgrp label{display:block;font-size:10px;font-weight:600;margin-bottom:3px}
        .fgrp input,.fgrp select,.fgrp textarea{width:100%;padding:7px 9px;border:1px solid var(--g);border-radius:6px;font-size:12px;outline:none;font-family:inherit;transition:var(--tr)}
        .fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--p)}
        .fgrp textarea{resize:vertical;min-height:50px}
        .checkrow{display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap;padding:8px;background:var(--lg);border-radius:6px}
        .chkitem{display:flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;font-weight:500}
        .chkitem input{accent-color:var(--p);width:14px;height:14px}
        .fbtnrow{display:flex;gap:8px;margin-top:6px}
        .bsave{padding:8px 18px;background:var(--s);color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;transition:var(--tr)}
        .bsave:hover{background:#218838}
        .bcancel{padding:8px 18px;background:var(--lg);border:1px solid var(--g);border-radius:6px;cursor:pointer;font-size:12px}

        /* CATEGORIES */
        .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
        .catcard{background:var(--w);padding:16px;border-radius:10px;text-align:center;box-shadow:var(--sh);transition:var(--tr);position:relative;border:2px solid transparent}
        .catcard:hover{transform:translateY(-2px);border-color:var(--pl)}
        .catcard i{font-size:24px;color:var(--p);margin-bottom:6px;display:block}
        .catcard h5{font-size:12px;margin-bottom:3px}
        .catcard span{font-size:10px;color:var(--mg)}
        .catcard .catbadge{position:absolute;top:6px;right:6px;background:var(--p);color:white;font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600}

        /* TAB HEADER */
        .tabheader{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
        .tabheader h4{font-size:14px;display:flex;align-items:center;gap:6px}
        .tabheader h4 i{color:var(--p);font-size:13px}

        /* EMPTY & LOADING */
        .empty2{text-align:center;padding:30px;color:var(--mg)}
        .empty2 i{font-size:35px;color:var(--g);margin-bottom:10px;display:block}
        .empty2 p{font-size:12px}
        .loading2{text-align:center;padding:25px;color:var(--mg)}
        .loading2 i{font-size:22px;color:var(--p);display:block;margin-bottom:8px;animation:spin 1s linear infinite}
        .loading2 p{font-size:11px}

        /* ALERT */
        .newalert{position:fixed;top:15px;right:15px;background:var(--s);color:white;padding:10px 18px;border-radius:10px;box-shadow:0 4px 15px rgba(40,167,69,0.4);z-index:9999;display:none;animation:slideUp 0.4s;font-weight:600;font-size:12px;align-items:center;gap:6px}

        /* RESPONSIVE */
        @media(max-width:1024px){
            .sgrid{grid-template-columns:repeat(2,1fr)}
            .dgrid{grid-template-columns:1fr}
            .catgrid{grid-template-columns:repeat(3,1fr)}
        }
        @media(max-width:768px){
            .sd{transform:translateX(-100%)}
            .sd.open{transform:translateX(0)}
            .main{margin-left:0}
            .mtoggle{display:block}
            .content{padding:12px 10px}
            .topbar2{padding:8px 12px}
            .topbar2 h3{font-size:14px}
            .sgrid{grid-template-columns:1fr 1fr;gap:8px}
            .scard{padding:12px;gap:8px}
            .sinfo h4{font-size:18px}
            .sinfo p{font-size:9px}
            .sicon{width:35px;height:35px;font-size:14px}
            .orowb{grid-template-columns:1fr 1fr;gap:4px}
            .frow{flex-direction:column;gap:0}
            .catgrid{grid-template-columns:repeat(2,1fr);gap:8px}
            .catcard{padding:12px}
            .catcard i{font-size:20px}
            .catcard h5{font-size:11px}
            .lb{padding:28px 22px;margin:10px}
            .lb h2{font-size:16px}
            .licon{width:50px;height:50px}
            .licon i{font-size:22px}
            .prow{padding:6px 8px;gap:6px}
            .pimg{width:30px;height:30px}
            .pinfo h5{font-size:10px}
            .pprice{font-size:10px;min-width:55px}
            .pacts button{width:24px;height:24px;font-size:9px}
            .filtbtns{gap:4px}
            .filtb{padding:5px 10px;font-size:10px}
        }
        @media(max-width:480px){
            .sgrid{grid-template-columns:1fr;gap:6px}
            .orowb{grid-template-columns:1fr;gap:3px}
            .catgrid{grid-template-columns:1fr 1fr;gap:6px}
            .prow{flex-wrap:wrap}
            .pprice,.pstock{min-width:auto}
            .pstock{display:none}
            .scard{padding:10px}
            .sinfo h4{font-size:16px}
        }
    </style>
</head>
<body>
<div class="newalert" id="alertBox" style="display:none;"><i class="fas fa-bell"></i> <span id="alertText"></span></div>

<!-- LOGIN -->
<div class="ls" id="loginScreen">
    <div class="lb">
        <div class="licon"><i class="fas fa-lock"></i></div>
        <h2>Admin Login</h2>
        <p>Enter password</p>
        <div class="linp">
            <input type="password" id="passInput" placeholder="Password" maxlength="20" onkeydown="if(event.key==='Enter')checkLogin()" oninput="clearLoginErr()">
            <button class="eyeb" onclick="toggleEye()"><i class="fas fa-eye" id="eyeIcon"></i></button>
        </div>
        <div class="lerr" id="loginErr"><i class="fas fa-exclamation-circle"></i> <span id="loginErrText"></span></div>
        <button class="lbtn" id="loginBtn" onclick="checkLogin()"><i class="fas fa-unlock-alt"></i> Login</button>
        <div class="lfooter" id="loginFooter"><i class="fas fa-shield-alt" style="color:var(--p)"></i> Protected</div>
        <a href="index.html" class="backl"><i class="fas fa-arrow-left"></i> Store</a>
    </div>
</div>

<!-- ADMIN -->
<div class="adm" id="adminPanel">
    <aside class="sd" id="sidebar">
        <div class="sdh"><div class="lgic"><i class="fas fa-bolt"></i></div><div><h2>Electro<span>Hub</span></h2><small>Admin</small></div></div>
        <nav class="sdnav">
            <a class="act" onclick="switchTab('dash',this)"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a onclick="switchTab('orders',this)"><i class="fas fa-shopping-bag"></i> Orders <span class="nbg" id="navOrders">0</span></a>
            <a onclick="switchTab('products',this)"><i class="fas fa-box"></i> Products <span class="nbg" id="navProds">0</span></a>
            <a onclick="switchTab('categories',this)"><i class="fas fa-tags"></i> Categories</a>
            <div class="ndiv"></div>
            <a onclick="switchTab('customers',this)"><i class="fas fa-users"></i> Customers <span class="nbg" id="navCusts">0</span></a>
        </nav>
        <div class="sdft"><a onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
    </aside>

    <div class="main">
        <div class="topbar2">
            <div style="display:flex;align-items:center;gap:10px;">
                <button class="mtoggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
                <h3 id="pageTitle"><i class="fas fa-tachometer-alt"></i> Dashboard</h3>
            </div>
            <div class="tright">
                <button class="rfbtn" id="refreshBtn" onclick="doRefresh()"><i class="fas fa-sync-alt"></i></button>
                <a href="index.html" class="stlink"><i class="fas fa-store"></i> Store</a>
            </div>
        </div>

        <div class="content">
            <!-- DASHBOARD -->
            <div class="atab act" id="dashTab">
                <div class="sgrid">
                    <div class="scard"><div class="sicon bl"><i class="fas fa-shopping-bag"></i></div><div class="sinfo"><h4 id="statOrders">0</h4><p>Orders</p></div></div>
                    <div class="scard"><div class="sicon gr"><i class="fas fa-money-bill-wave"></i></div><div class="sinfo"><h4 id="statRevenue">Rs.0</h4><p>Revenue</p></div></div>
                    <div class="scard"><div class="sicon or"><i class="fas fa-box"></i></div><div class="sinfo"><h4 id="statProducts">0</h4><p>Products</p></div></div>
                    <div class="scard"><div class="sicon rd"><i class="fas fa-clock"></i></div><div class="sinfo"><h4 id="statPending">0</h4><p>Pending</p></div></div>
                </div>
                <div class="dgrid">
                    <div class="card2"><h4><i class="fas fa-clock"></i> Recent Orders</h4><div id="recentOrdersDiv"></div></div>
                    <div>
                        <div class="card2"><h4><i class="fas fa-chart-pie"></i> Status</h4><div id="statusSumDiv"></div></div>
                        <div class="card2"><h4><i class="fas fa-exclamation-triangle"></i> Low Stock</h4><div id="lowStockDiv"></div></div>
                    </div>
                </div>
            </div>

            <!-- ORDERS -->
            <div class="atab" id="ordersTab">

                    <button class="filtb" onclick="filterOrders('Confirmed',this)">🔵 Confirmed</button>
                    <button class="filtb" onclick="filterOrders('Shipped',this)">🚚 Shipped</button>
                    <button class="filtb" onclick="filterOrders('Delivered',this)">✅ Delivered</button>

            <!-- PRODUCTS -->

                </div>
                <div class="pform" id="productForm">
                    <h4><i class="fas fa-edit"></i> <span id="formTitle">Add Product</span></h4>
                    <div class="frow">
                        <div class="fgrp"><label>Name *</label><input type="text" id="fName" placeholder="Product name"></div>
                        <div class="fgrp"><label>Category *</label>
                            <select id="fCategory"><option value="chargers">⚡ Chargers</option><option value="cables">🔌 Cables</option><option value="earphones">🎧 Earphones</option><option value="powerbanks">🔋 Power Banks</option><option value="holders">📱 Holders</option><option value="watches">⌚ Watches</option><option value="protectors">🛡️ Protectors</option><option value="covers">📦 Covers</option><option value="speakers">🔊 Speakers</option><option value="adapters">🔄 Adapters</option><option value="lights">💡 Lights</option><option value="stands">🖥️ Stands</option><option value="keyboards">⌨️ Keyboards</option><option value="storage">💾 Storage</option><option value="cameras">📸 Cameras</option><option value="other">📦 Other</option></select>
                        </div>
                    </div>
                    <div class="frow">
                        <div class="fgrp"><label>Price *</label><input type="number" id="fPrice" placeholder="1499"></div>
                        <div class="fgrp"><label>Old Price</label><input type="number" id="fOldPrice" placeholder="2999"></div>
                        <div class="fgrp"><label>Stock *</label><input type="number" id="fStock" placeholder="50"></div>
                    </div>
                    <div class="fgrp"><label>Image URL</label><input type="text" id="fImage" placeholder="https://..."></div>
                    <div class="fgrp"><label>Description</label><textarea id="fDesc" placeholder="Description..."></textarea></div>
                    <div class="checkrow">
                        <label class="chkitem"><input type="checkbox" id="fIsNew"> 🆕 New</label>
                        <label class="chkitem"><input type="checkbox" id="fIsHot"> 🔥 Hot</label>

                    </div>
                    <div class="fbtnrow">
                        <button class="bsave" id="saveBtn" onclick="saveProduct()"><i class="fas fa-save"></i> Save</button>
                        <button class="bcancel" onclick="hideForm()">Cancel</button>
                    </div>
                </div>
                <div id="productsListDiv"></div>
            </div>

            <!-- CATEGORIES -->
            <div class="atab" id="categoriesTab">
                <div class="tabheader"><h4><i class="fas fa-tags"></i> Categories</h4></div>
                <div class="catgrid" id="categoriesDiv"></div>
            </div>

            <!-- CUSTOMERS -->
            <div class="atab" id="customersTab">
                <div class="tabheader"><h4><i class="fas fa-users"></i> Customers</h4></div>
                <div id="customersDiv"></div>
            </div>

</div>

<script>
var SB='https://iguhpaqocjxwtfkpbgbg.supabase.co',SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlndWhwYXFvY2p4d3Rma3BiZ2JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTEyMjQsImV4cCI6MjEwMDgyNzIyNH0.BrJb1CuFopsT4cQQtb4hf9jGznXxjcPnA-DsJ9vwmsc',HH={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=representation'};
async function api(m,t,p,b){try{var u=SB+'/rest/v1/'+t;if(p)u+='?'+p;var o={method:m,headers:HH};if(b)o.body=JSON.stringify(b);var r=await fetch(u,o);if(!r.ok){console.error(m+' '+t+':',await r.text());return m==='DELETE'?false:[];}return m==='DELETE'?true:await r.json();}catch(e){console.error(e);return m==='DELETE'?false:[];}}
var PASS="28610",attempts=0,orders=[],products=[],lastCount=0,editingId=null;
var ICONS={chargers:'fas fa-charging-station',cables:'fas fa-plug',earphones:'fas fa-headphones-alt',powerbanks:'fas fa-battery-full',holders:'fas fa-mobile-alt',watches:'fas fa-clock',protectors:'fas fa-shield-alt',covers:'fas fa-tablet-alt',speakers:'fas fa-volume-up',adapters:'fas fa-exchange-alt',lights:'fas fa-lightbulb',stands:'fas fa-laptop',keyboards:'fas fa-keyboard',storage:'fas fa-hdd',cameras:'fas fa-camera',other:'fas fa-box'};
var NAMES={chargers:'Chargers',cables:'Cables',earphones:'Earphones',powerbanks:'Power Banks',holders:'Holders',watches:'Watches',protectors:'Protectors',covers:'Covers',speakers:'Speakers',adapters:'Adapters',lights:'Lights',stands:'Stands',keyboards:'Keyboards',storage:'Storage',cameras:'Cameras',other:'Other'};

if(sessionStorage.getItem('adminOK')==='1'){document.getElementById('loginScreen').classList.add('h');document.getElementById('adminPanel').classList.add('sh');startAdmin();}
function checkLogin(){var inp=document.getElementById('passInput'),btn=document.getElementById('loginBtn'),val=inp.value.trim();if(!val){showLoginErr('Enter password');inp.classList.add('err');setTimeout(function(){inp.classList.remove('err');},500);return;}if(val===PASS){inp.classList.add('ok');btn.innerHTML='<i class="fas fa-check-circle"></i> Granted!';btn.classList.add('ok');sessionStorage.setItem('adminOK','1');setTimeout(function(){document.getElementById('loginScreen').classList.add('h');document.getElementById('adminPanel').classList.add('sh');startAdmin();},700);}else{attempts++;inp.classList.add('err');setTimeout(function(){inp.classList.remove('err');},500);if(attempts>=5){showLoginErr('Locked 30s');btn.disabled=true;inp.disabled=true;var t=30,f=document.getElementById('loginFooter');f.innerHTML='<span style="color:var(--dn)"><i class="fas fa-lock"></i> '+t+'s</span>';var timer=setInterval(function(){t--;f.innerHTML='<span style="color:var(--dn)">'+t+'s</span>';if(t<=0){clearInterval(timer);attempts=0;btn.disabled=false;inp.disabled=false;inp.value='';clearLoginErr();f.innerHTML='<i class="fas fa-shield-alt" style="color:var(--p)"></i> Protected';}},1000);}else showLoginErr('Wrong! '+(5-attempts)+' left');}}
function showLoginErr(m){document.getElementById('loginErrText').textContent=m;document.getElementById('loginErr').classList.add('sh');}
function clearLoginErr(){document.getElementById('loginErr').classList.remove('sh');}
function toggleEye(){var i=document.getElementById('passInput'),e=document.getElementById('eyeIcon');if(i.type==='password'){i.type='text';e.className='fas fa-eye-slash';}else{i.type='password';e.className='fas fa-eye';}i.focus();}
function adminLogout(){sessionStorage.removeItem('adminOK');location.reload();}

async function startAdmin(){showLoad('recentOrdersDiv');showLoad('ordersListDiv');showLoad('productsListDiv');await loadAllData();setInterval(async function(){var n=await api('GET','orders','select=id&order=created_at.desc');if(n&&n.length>lastCount){showAlert('🔔 New order!');lastCount=n.length;await loadAllData();}},5000);}
async function loadAllData(){orders=await api('GET','orders','select=*&order=created_at.desc');products=await api('GET','products','select=*&order=id.asc');var custs=await api('GET','customers','select=*&order=created_at.desc');lastCount=orders.length;document.getElementById('navOrders').textContent=orders.length;document.getElementById('navProds').textContent=products.length;document.getElementById('navCusts').textContent=custs?custs.length:0;var pend=orders.filter(function(o){return o.status==='Pending';}).length;if(pend>0)document.getElementById('navOrders').classList.add('red');else document.getElementById('navOrders').classList.remove('red');renderDashboard();renderOrdersList();renderProductsList();renderCategories();renderCustomers(custs);}
async function doRefresh(){var b=document.getElementById('refreshBtn');b.classList.add('spinning');await loadAllData();setTimeout(function(){b.classList.remove('spinning');},500);}
function showLoad(id){document.getElementById(id).innerHTML='<div class="loading2"><i class="fas fa-spinner"></i><p>Loading...</p></div>';}
function showAlert(t){var a=document.getElementById('alertBox');document.getElementById('alertText').textContent=t;a.style.display='flex';setTimeout(function(){a.style.display='none';},5000);}
function timeAgo(d){var df=Date.now()-new Date(d).getTime(),m=Math.floor(df/60000);if(m<1)return'Now';if(m<60)return m+'m';var h=Math.floor(m/60);if(h<24)return h+'h';return Math.floor(h/24)+'d';}
function switchTab(t,el){document.querySelectorAll('.atab').forEach(function(x){x.classList.remove('act');});document.getElementById(t+'Tab').classList.add('act');document.querySelectorAll('.sdnav a').forEach(function(a){a.classList.remove('act');});if(el)el.classList.add('act');var ti={dash:'Dashboard',orders:'Orders',products:'Products',categories:'Categories',customers:'Customers'},ic={dash:'tachometer-alt',orders:'shopping-bag',products:'box',categories:'tags',customers:'users'};document.getElementById('pageTitle').innerHTML='<i class="fas fa-'+ic[t]+'"></i> '+ti[t];document.getElementById('sidebar').classList.remove('open');}

function renderDashboard(){document.getElementById('statOrders').textContent=orders.length;var rev=0;orders.forEach(function(o){if(o.status!=='Cancelled')rev+=o.total;});document.getElementById('statRevenue').textContent='Rs.'+rev.toLocaleString();document.getElementById('statProducts').textContent=products.length;var pend=orders.filter(function(o){return o.status==='Pending';}).length;document.getElementById('statPending').textContent=pend;var rec=orders.slice(0,5);document.getElementById('recentOrdersDiv').innerHTML=rec.length?rec.map(function(o){return'<div class="orow'+(o.status==='Pending'?' neworder':'')+'" style="padding:8px;margin-bottom:5px;"><div class="orowh"><h5>'+o.id+'</h5><span style="font-size:9px;color:var(--mg)">'+timeAgo(o.created_at)+'</span><span class="sbadge s-'+o.status+'">'+o.status+'</span></div><div style="display:flex;justify-content:space-between;font-size:10px;flex-wrap:wrap;gap:3px;"><span>'+o.customer_name+'</span><span>'+o.customer_phone+'</span><strong style="color:var(--p)">Rs.'+o.total.toLocaleString()+'</strong></div></div>';}).join(''):'<div class="empty2"><i class="fas fa-inbox"></i><p>No orders</p></div>';var sts=['Pending','Confirmed','Shipped','Delivered','Cancelled'];document.getElementById('statusSumDiv').innerHTML=sts.map(function(s){return'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--g);font-size:11px;"><span class="sbadge s-'+s+'">'+s+'</span><strong>'+orders.filter(function(o){return o.status===s;}).length+'</strong></div>';}).join('');var low=products.filter(function(p){return p.stock<=10;}).sort(function(a,b){return a.stock-b.stock;}).slice(0,5);document.getElementById('lowStockDiv').innerHTML=low.length?low.map(function(p){return'<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--g);font-size:10px;"><span>'+p.name.substring(0,20)+'...</span><strong style="color:'+(p.stock<=0?'var(--dn)':'var(--wn)')+'">'+( p.stock<=0?'OUT':p.stock)+'</strong></div>';}).join(''):'<p style="color:var(--mg);text-align:center;padding:10px;font-size:10px;">All stocked ✅</p>';}

function renderOrdersList(filter){var fl=orders;if(filter&&filter!=='all')fl=orders.filter(function(o){return o.status===filter;});var el=document.getElementById('ordersListDiv');if(!fl.length){el.innerHTML='<div class="empty2"><i class="fas fa-inbox"></i><p>No orders</p></div>';return;}el.innerHTML=fl.map(function(o){var items=o.items||[];var ih=items.map(function(it){return'<div class="oiline"><span>'+it.name+' × '+it.qty+'</span><strong>Rs.'+(it.price*it.qty).toLocaleString()+'</strong></div>';}).join('');return'<div class="orow"><div class="orowh"><h5><i class="fas fa-receipt"></i> '+o.id+'</h5><span style="font-size:9px;color:var(--mg)">'+new Date(o.created_at).toLocaleString()+'</span><span class="sbadge s-'+o.status+'">'+o.status+'</span></div><div class="orowb"><span>Customer<strong>'+o.customer_name+'</strong></span><span>Phone<strong>'+o.customer_phone+'</strong></span><span>Email<strong>'+(o.customer_email||'N/A')+'</strong></span><span>City<strong>'+o.customer_city+'</strong></span><span>Address<strong>'+(o.customer_address||'').substring(0,40)+'</strong></span><span>Payment<strong>COD</strong></span></div><div class="oitems"><h6><i class="fas fa-box"></i> Items ('+items.length+')</h6>'+ih+'</div>'+(o.notes?'<div style="background:#FFF3E6;padding:5px 8px;border-radius:5px;font-size:10px;margin-bottom:6px;"><i class="fas fa-sticky-note" style="color:var(--p)"></i> '+o.notes+'</div>':'')+'<div class="orowf"><div style="display:flex;align-items:center;gap:6px;"><label style="font-size:10px;font-weight:600;">Status:</label><select class="ssel" onchange="updateStatus(\''+o.id+'\',this.value)"><option value="Pending"'+(o.status==='Pending'?' selected':'')+'>🟡 Pending</option><option value="Confirmed"'+(o.status==='Confirmed'?' selected':'')+'>🔵 Confirmed</option><option value="Shipped"'+(o.status==='Shipped'?' selected':'')+'>🚚 Shipped</option><option value="Delivered"'+(o.status==='Delivered'?' selected':'')+'>✅ Delivered</option><option value="Cancelled"'+(o.status==='Cancelled'?' selected':'')+'>❌ Cancelled</option></select></div><span class="ototal">Rs.'+o.total.toLocaleString()+'</span></div></div>';}).join('');}
function filterOrders(s,btn){document.querySelectorAll('.filtb').forEach(function(b){b.classList.remove('act');});btn.classList.add('act');renderOrdersList(s);}
async function updateStatus(id,status){var o=orders.find(function(x){return x.id===id;});if(!o)return;var sh=o.status_history||[];sh.push({status:status,time:new Date().toISOString(),note:'Admin'});var data={status:status,status_history:sh};if(status==='Shipped')data.estimated_delivery=new Date(Date.now()+3*86400000).toISOString();if(status==='Delivered')data.delivered_at=new Date().toISOString();var r=await api('PATCH','orders','id=eq.'+id,data);if(r){o.status=status;o.status_history=sh;renderDashboard();renderOrdersList();showAlert('✅ '+id+' → '+status);}else alert('Failed!');}

function renderProductsList(){var el=document.getElementById('productsListDiv');if(!products.length){el.innerHTML='<div class="empty2"><i class="fas fa-box-open"></i><p>No products</p></div>';return;}el.innerHTML=products.map(function(p){var icon=ICONS[p.category]||'fas fa-box';var catName=NAMES[p.category]||p.category;var tags='';if(p.is_new)tags+='<span class="ptag new">NEW</span> ';if(p.is_hot)tags+='<span class="ptag hot">HOT</span> ';if(p.is_sale)tags+='<span class="ptag sale">SALE</span> ';if(p.is_flash)tags+='<span class="ptag flash">FLASH</span> ';return'<div class="prow"><div class="pimg">'+(p.image?'<img src="'+p.image+'">':'<i class="'+icon+'"></i>')+'</div><div class="pinfo"><h5>'+p.name+'</h5><span>'+catName+' '+tags+'</span></div><div class="pprice">Rs.'+p.price.toLocaleString()+(p.old_price?' <s>Rs.'+p.old_price.toLocaleString()+'</s>':'')+'</div><div class="pstock'+(p.stock<=10?' low':'')+'">'+(p.stock<=0?'❌':p.stock<=10?'⚠️'+p.stock:'✅'+p.stock)+'</div><div class="pacts"><button class="bedit" onclick="editProduct('+p.id+')"><i class="fas fa-edit"></i></button><button class="bdel" onclick="deleteProduct('+p.id+')"><i class="fas fa-trash"></i></button></div></div>';}).join('');}

function showAddForm(){editingId=null;document.getElementById('formTitle').textContent='Add Product';document.getElementById('fName').value='';document.getElementById('fCategory').value='chargers';document.getElementById('fPrice').value='';document.getElementById('fOldPrice').value='';document.getElementById('fStock').value='';document.getElementById('fImage').value='';document.getElementById('fDesc').value='';document.getElementById('fIsNew').checked=false;document.getElementById('fIsHot').checked=false;document.getElementById('fIsSale').checked=false;document.getElementById('fIsFlash').checked=false;document.getElementById('productForm').classList.add('show');document.getElementById('productForm').scrollIntoView({behavior:'smooth'});}
function editProduct(id){var p=products.find(function(x){return x.id===id;});if(!p)return;editingId=id;document.getElementById('formTitle').textContent='Edit: '+p.name;document.getElementById('fName').value=p.name;document.getElementById('fCategory').value=p.category;document.getElementById('fPrice').value=p.price;document.getElementById('fOldPrice').value=p.old_price||'';document.getElementById('fStock').value=p.stock;document.getElementById('fImage').value=p.image||'';document.getElementById('fDesc').value=p.description||'';document.getElementById('fIsNew').checked=p.is_new||false;document.getElementById('fIsHot').checked=p.is_hot||false;document.getElementById('fIsSale').checked=p.is_sale||false;document.getElementById('fIsFlash').checked=p.is_flash||false;document.getElementById('productForm').classList.add('show');document.getElementById('productForm').scrollIntoView({behavior:'smooth'});}
function hideForm(){document.getElementById('productForm').classList.remove('show');editingId=null;}
async function saveProduct(){var name=document.getElementById('fName').value.trim(),price=parseInt(document.getElementById('fPrice').value);if(!name){alert('Name required!');return;}if(!price){alert('Price required!');return;}var btn=document.getElementById('saveBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Saving...';var data={name:name,category:document.getElementById('fCategory').value,price:price,old_price:parseInt(document.getElementById('fOldPrice').value)||0,stock:parseInt(document.getElementById('fStock').value)||0,image:document.getElementById('fImage').value.trim(),description:document.getElementById('fDesc').value.trim(),brand:'Generic',compat:'all',is_new:document.getElementById('fIsNew').checked,is_hot:document.getElementById('fIsHot').checked,is_sale:document.getElementById('fIsSale').checked,is_flash:document.getElementById('fIsFlash').checked};var result;if(editingId){result=await api('PATCH','products','id=eq.'+editingId,data);if(result){showAlert('✅ Updated!');hideForm();await loadAllData();}else alert('Failed!');}else{data.rating=4.0;data.reviews=0;result=await api('POST','products','',data);if(result){showAlert('✅ Added!');hideForm();await loadAllData();}else alert('Failed!');}btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> Save';}
async function deleteProduct(id){var p=products.find(function(x){return x.id===id;});if(!confirm('Delete "'+p.name+'"?'))return;var r=await api('DELETE','products','id=eq.'+id);if(r){showAlert('🗑️ Deleted');await loadAllData();}else alert('Failed!');}

function renderCategories(){var cats={};products.forEach(function(p){if(!cats[p.category])cats[p.category]={count:0,stock:0};cats[p.category].count++;cats[p.category].stock+=p.stock;});var keys=Object.keys(cats);if(!keys.length){document.getElementById('categoriesDiv').innerHTML='<div class="empty2"><i class="fas fa-tags"></i><p>No categories</p></div>';return;}document.getElementById('categoriesDiv').innerHTML=keys.map(function(k){var c=cats[k];return'<div class="catcard"><div class="catbadge">'+c.count+'</div><i class="'+(ICONS[k]||'fas fa-box')+'"></i><h5>'+(NAMES[k]||k)+'</h5><span>Stock: '+c.stock+'</span></div>';}).join('');}

function renderCustomers(custs){custs=custs||[];var el=document.getElementById('customersDiv');if(!custs.length){el.innerHTML='<div class="empty2"><i class="fas fa-users"></i><p>No customers</p></div>';return;}el.innerHTML=custs.map(function(c){var myOrders=orders.filter(function(o){return o.customer_phone===c.phone;});var ts=0;myOrders.forEach(function(o){if(o.status!=='Cancelled')ts+=o.total;});return'<div class="orow"><div class="orowh"><h5><i class="fas fa-user-check" style="color:var(--s);margin-right:4px;"></i>'+c.name+'</h5><span class="ototal">Rs.'+ts.toLocaleString()+'</span></div><div class="orowb"><span>Phone<strong>'+c.phone+'</strong></span><span>Email<strong>'+(c.email||'N/A')+'</strong></span><span>City<strong>'+(c.city||'N/A')+'</strong></span><span>Address<strong>'+(c.address||'').substring(0,35)+'</strong></span><span>Orders<strong>'+myOrders.length+'</strong></span><span>Joined<strong>'+timeAgo(c.created_at)+'</strong></span></div></div>';}).join('');}
</script>
